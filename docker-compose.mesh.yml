# docker-compose.mesh.yml — the DreamNet mesh-test harness (Infrastructure as Myth, IaC backup).
#
# A source Herm (Lares Viales) announces a dial on its public FLOW-map; a relay chain carries it
# container-to-container across the astral space. Proves the mesh-palace BEING a mesh — the wayfarers
# walking the roads, each blind to the territory, carrying only the public map.
#
#   herm-source  (HERM_SEED=alpha) → herm-relay-1 (pulls source) → herm-relay-2 (pulls relay-1)
#
# Run:     docker compose -f docker-compose.mesh.yml up -d
# Witness: node tools/herm-mesh-witness.mjs      (pulls relay-2 on :18080, asserts alpha crossed 3 hops)
# Down:    docker compose -f docker-compose.mesh.yml down
#
# Hermai run dev-style (node:24-slim + the mounted repo + built dist) — no image build, fast iterate.
# Full Lararia (the serve stage) layer on next, once their containerized genesis ceremony is wired.

name: dreamnet-mesh

x-herm: &herm
  image: node:24-slim
  working_dir: /app
  volumes:
    - ".:/app"
  command: ["node", "packages/lararium-node/dist/src/herm-main.js"]
  networks: [mesh]
  restart: unless-stopped

services:
  herm-source:
    <<: *herm
    environment:
      HERM_PORT: "8080"
      HERM_SEED: "alpha"        # announces lar:///ha.ka.ba/@oracle/herm/alpha on its FLOW-map

  herm-relay-1:
    <<: *herm
    environment:
      HERM_PORT: "8080"
      HERM_PEERS: "http://herm-source:8080"
      HERM_PULL_MS: "1500"
    depends_on: [herm-source]

  herm-relay-2:
    <<: *herm
    environment:
      HERM_PORT: "8080"
      HERM_PEERS: "http://herm-relay-1:8080"
      HERM_PULL_MS: "1500"
    ports:
      - "18080:8080"           # expose the tail of the chain to the host for the witness
    depends_on: [herm-relay-1]

networks:
  mesh:
    driver: bridge
